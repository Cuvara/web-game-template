# CI — the `ci_green` guard.
#
# The Factory's title machine names this file as what implements `ci_green`, and that guard
# sits on three transitions: scaffolding -> prototype, prototype -> prototype-review, and
# production -> releasing. A title cannot advance past any of them without this passing on
# the named commit, so it stays fast and it stays about the source, not the artifact.
#
# The heavier suite — built artifacts, performance, platform assertions — is verify.yml.

name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint, typecheck, unit, integration, sdk
    runs-on: ubuntu-latest
    # A push and a pull_request from the same repository are the same commit twice. Skip the
    # pull_request event unless it comes from a fork, whose pushes we never see.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-workspace

      # Each step is named after a suite in qa-report.schema.json's `suites[].name` enum, so
      # a run's results map onto the QA report without anyone having to translate them.
      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: unit
        run: pnpm test:unit

      - name: integration
        run: pnpm test:integration

      # The SDK conformance project (vitest --project sdk) needs no browser, so it belongs on
      # the source-level guard alongside unit and integration rather than in verify.yml.
      - name: sdk-conformance
        run: pnpm test:sdk

      # The boot wiring (bootPlatform -> installGameplay -> createGame) and the integration
      # plan the Factory's `sdk` step regenerates. Static, so it belongs on the source guard.
      - name: sdk-check
        run: pnpm sdk:check

      - name: Summary
        if: always()
        run: |
          {
            echo "### CI — \`ci_green\`"
            echo
            echo "commit \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`"
            echo
            echo "status: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  golden:
    # The Factory's golden-run ports (examples/*/wgf-golden, examples/wgf-golden-shared).
    # Template-only: a game created by the Factory ships no examples/, so every step after
    # checkout is skipped there. hashFiles is not available in a job-level `if`, which is why
    # the guard sits on the steps.
    name: golden ports
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-workspace
        if: hashFiles('examples/wgf-golden-shared/README.md') != ''
        with:
          # golden-check runs each port's e2e, SDK browser and verify suites.
          install-browsers: "true"

      - name: golden-check
        if: hashFiles('examples/wgf-golden-shared/README.md') != ''
        run: node scripts/verify/golden-check.mjs

      - name: skipped — no golden ports in this checkout
        if: hashFiles('examples/wgf-golden-shared/README.md') == ''
        run: echo "examples/wgf-golden-shared is absent; nothing to check."
