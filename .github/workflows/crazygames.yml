# CrazyGames — adapter, compliance demo, build audit.
#
# Runs whenever something the CrazyGames integration depends on changes. It proves three
# things on a clean runner, against the BUILT demo rather than source:
#
#   1. the adapter behaves as the official docs require (unit tests, mocked SDK)
#   2. the demo exercises Boot -> SDK init -> gameplay -> ad -> resume -> save on desktop,
#      mobile and tablet viewports, including unfilled / adblock / Basic Launch answers
#   3. the build is within the documented limits (size, file count, relative paths, no
#      foreign scripts, no secrets), with initial download reported as APPROXIMATION
#
# What it cannot prove is recorded in compliance/crazygames-compliance-report.md: the
# CrazyGames QA tool needs a Developer Portal login and an upload, so it is a manual step,
# and a green run here is never CrazyGames approval.
#
# Nothing here publishes, uploads or needs a secret.

name: CrazyGames

on:
  push:
    paths:
      - "packages/platform-sdk/**"
      - "packages/game-core/**"
      - "packages/pixi-framework/**"
      - "examples/crazygames-compliance-demo/**"
      - "tests/crazygames/**"
      - "tests/unit/crazygames*"
      - "tests/integration/crazygames*"
      - "scripts/crazygames-audit.mjs"
      - "config/platforms/crazygames-limits.json"
      - "playwright.crazygames.config.ts"
      - "vite.config.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/crazygames.yml"
  pull_request:
  workflow_dispatch:
    inputs:
      live_sdk:
        description: Also run the smoke test against the live SDK from sdk.crazygames.com
        type: boolean
        default: false

concurrency:
  group: crazygames-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crazygames:
    name: adapter, demo, audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same de-duplication as ci.yml: a PR from this repository is the push event again.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-workspace
        with:
          install-browsers: "true"

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: unit
        run: pnpm vitest run --project unit tests/unit/crazygames

      - name: integration
        run: pnpm vitest run --project integration tests/integration/crazygames

      - name: build demo
        run: pnpm build:crazygames-demo

      - name: browser suite (desktop, mobile, tablet)
        run: pnpm test:crazygames

      - name: live SDK smoke
        if: inputs.live_sdk
        env:
          CG_LIVE_SDK: "1"
        run: pnpm test:crazygames tests/crazygames/live-sdk.spec.ts --project desktop

      - name: build audit
        run: pnpm audit:crazygames --dir examples/crazygames-compliance-demo/dist

      - name: Summary
        if: always()
        run: |
          {
            echo "### CrazyGames"
            echo
            echo "Not CrazyGames approval. QA tool: MANUAL_REVIEW_REQUIRED."
            echo
            if [ -f build/crazygames-audit.md ]; then cat build/crazygames-audit.md; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit and browser report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: crazygames-audit
          path: |
            build/crazygames-audit.json
            build/crazygames-audit.md
            build/crazygames-runtime.json
            playwright-report/crazygames
          if-no-files-found: warn
