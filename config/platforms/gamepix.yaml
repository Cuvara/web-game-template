# Platform profile — GamePix (PROPOSED)
#
# Not vendored from the Factory: core/reference/platforms/ has no GamePix profile yet, so this
# file is not listed in pinned.json and carries no content hash. It is written here, in the
# Factory's platform-profile schema, so a title can pin `gamepix@1.0.0` and release validation
# (scripts/verify/evaluate-assertions.mjs) has rules to judge it by. Upstreaming it to
# core/reference/platforms/gamepix.yaml is a Factory change; until then treat it as a proposal.
#
# Every figure below comes from GamePix's own pages, read 2026-10-04:
#   JS   https://partners.gamepix.com/sdk/doc/javascript      (the JavaScript SDK reference)
#   SUB  https://partners.gamepix.com/guidelines/submission   (submission guidelines)
#   DEV  https://partners.gamepix.com/developers              (developer program)
# Where they say nothing — bundle size, listing sizes, review time, ad-blocker behaviour — the
# field is null or left out rather than guessed. docs/platforms/gamepix.md has the audit.
#
# Portal ids: none. No Game ID or key goes into the code (JS); the GamePix dashboard
# identifies the game. Exclusivity: a game is exclusive to gamepix.com unless "Allow
# Distribution" is selected at submission (DEV, SUB) — an account choice a person makes, not
# a build setting.

id: gamepix
name: GamePix
version: 1.0.0
status: unverified
docs: https://partners.gamepix.com/sdk/doc/javascript

# audience: not documented; left out rather than guessed.

capabilities:
  # JS: GamePix.interstitialAd() and GamePix.rewardAd() (beta). No banner is documented.
  ads: [interstitial, rewarded]
  iap: false
  # JS: GamePix.localStorage is browser storage behind GamePix's API ("third-party browser
  # restrictions may purge data"), not a cloud save.
  cloud_saves: false
  leaderboards: false
  achievements: false
  auth: none
  # SUB: no other analytics, ad or social SDKs; GamePix measures play itself.
  analytics: platform-provided

requirements:
  # JS: GamePix.lang() reports one of ar zh nl en fr de it ja ko pl pt ru es tr, default
  # English. No locale is required.
  locales_required: []
  locales_recommended: []
  # Not documented.
  max_bundle_mb: null
  # SUB: the game resizes to its iframe (at least 640x480), plays in both orientations, and
  # shows no "rotate your device" prompt.
  orientation: [landscape, portrait]
  # JS: GamePix.loading(0-100) and GamePix.loaded(), which every other call waits on.
  loading_api: required
  offline_start: false
  https_only: true
  # SUB: no external links; relative paths only.
  no_external_links: true

ads:
  # JS: "Not every single interstitialAd() will trigger an ad" — GamePix decides the
  # frequency and asks games to signal every commercial break. No interval is set here.
  interstitial_min_interval_s: null
  rewarded_available: true
  banner_available: false
  notes: >
    Pause the game, audio included, before interstitialAd() / rewardAd() and resume in the
    callback; never call either twice before it settles. Ads only at natural breaks, never
    during gameplay and never on a timer. Reward only on success: true (rewarded is beta and
    fill varies). Pause on a hidden tab. No window.alert/confirm, no quit button; keep
    space, arrows and the wheel from scrolling the page.

metadata_requirements:
  descriptions_locales: [en]
  screenshots_min: 0
  # SUB: an icon and a cover are asked for; their sizes are behind the dashboard login.
  icon_required: true
  age_rating_required: false

review:
  # SUB describes a review before publication; its length is not documented.
  process: manual
  common_rejections:
    - The SDK script is not the first script in <head>.
    - Ads during gameplay, or triggered by a timer.
    - External links, or another analytics, ad or social SDK in the build.
    - A "rotate your device" prompt, a quit button, or a game that does not resize to its iframe.

# What the portal's listing takes. The dashboard is behind a login: every limit is null
# (UNKNOWN to validation, never passed) until someone records it with its source.
store_listing:
  status: unverified
  source: https://partners.gamepix.com/guidelines/submission
  notes: An icon and a cover, and a title matching the game (SUB); sizes and limits unknown.
  title: { required: true, max_chars: null }
  short_description: { required: true, max_chars: null }
  long_description: { required: false, max_chars: null }
  locales: [en]
  icon:
    {
      id: icon,
      required: true,
      sizes: null,
      aspect: null,
      formats: null,
      max_kb: null,
      source: icon,
    }
  covers: []
  screenshots:
    { required: false, min: 0, max: null, sizes: null, aspect: null, formats: null, max_kb: null }
  video: { required: false, formats: null, min_seconds: null, max_seconds: null, max_mb: null }

assertions:
  # package.platform_sdk is derived from the built artifact (the portal SDK signatures it
  # ships), so it names the one portal the build targets.
  - id: gamepix_sdk_present
    check: { left: package.platform_sdk, op: eq, right: gamepix }
    severity: blocking
    rationale: >
      The GamePix SDK (https://integration.gamepix.com/sdk/v3/gamepix.sdk.js) as the first
      script in <head> is the one integration step GamePix marks Mandatory.
  - id: gamepix_loading_api
    check: { left: package.calls_loading_api, op: eq, right: true }
    severity: blocking
    rationale: GamePix.loaded() must be called before any other SDK method.
  - id: gamepix_no_external_links
    check: { left: package.external_links, op: eq, right: 0 }
    severity: blocking
  - id: gamepix_no_banner_ads
    check: { left: package.uses_banner_ads, op: eq, right: false }
    severity: blocking

scoring_hints:
  platform_fit_favours:
    - Casual titles with frequent natural breaks to signal as commercial breaks.
    - Designs that play in both orientations and in a small (640x480) iframe.
  platform_fit_penalizes:
    - Designs that need cloud saves, sign-in, leaderboards or IAP.
    - Monetization that depends on rewarded ads alone (beta, variable fill).
