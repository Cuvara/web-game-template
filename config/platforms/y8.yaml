# Platform profile — Y8
#
# See yandex.yaml for how profiles are consumed. Upstreamed from web-game-template's draft
# (config/platforms/y8.yaml, docs/platforms/y8.md). Every figure comes from
# https://docs.y8.com/ as read on 2026-09-24; where the docs say nothing — audience, bundle
# size, review time, metadata — the field is left out rather than guessed. Unverified: no
# figure here has been confirmed by a live submission.
#
# Portal ids. game.config.yaml platforms[] carries them per title (tech_plan
# repo_params.game_config.platforms[]): `app_id` (the Developer Portal's App ID) is required
# at build — without it the template never loads the SDK — and `game_id` (for ads) is
# optional. Both may instead come from WGF_Y8_APP_ID / WGF_Y8_GAME_ID at build time.

id: y8
name: Y8
version: 1.0.0
status: unverified
docs: https://docs.y8.com/

capabilities:
  # https://docs.y8.com/sdk/advertising/ — interstitials and rewarded ads. No banner is
  # documented.
  ads: [interstitial, rewarded]
  iap: false
  # https://docs.y8.com/sdk/cloud-storage/ — signed-in players only.
  cloud_saves: true
  # The platform offers both; the template's Platform contract does not expose them yet.
  leaderboards: true
  achievements: true
  # https://docs.y8.com/best-practices/ — "Let guests play".
  auth: optional
  # https://docs.y8.com/sdk/analytics/ — plays counted on init.
  analytics: platform-provided

requirements:
  # The docs require no locale. getPlatformLocale() reports the site's language.
  locales_required: []
  max_bundle_mb: null
  # No loading or game-ready API exists in the SDK.
  loading_api: none

ads:
  # "By default Y8 allows one roughly every 180 seconds, configurable per game." The SDK
  # enforces it and reports frequencyCapped; the adapter does not count locally.
  interstitial_min_interval_s: 180
  rewarded_available: true
  banner_available: false
  notes: >
    Pause and mute inside beforeAd, resume inside afterAd — a skipped or capped break fires
    neither. Rewarded ads are never capped but restart the interstitial interval. Never
    request the preroll placement; the platform runs it itself.

review:
  # "While your game is in review, the platform serves Google's test creatives" — review
  # exists; its length is not documented.
  process: manual
  common_rejections: []

assertions:
  # package.platform_sdk is derived from the built artifact (the portal SDK signatures it
  # ships), so it names the one portal the build targets.
  - id: y8_sdk_present
    check: { left: package.platform_sdk, op: eq, right: y8 }
    severity: blocking
    rationale: >
      The Y8 SDK is loaded from https://cdn.y8.com/minimal-sdk/2-0/y8.min.js at runtime;
      a build for Y8 without it earns nothing and counts no plays.

scoring_hints:
  platform_fit_favours:
    - Casual titles that let guests play without signing in.
    - Designs with natural breaks for interstitials and an optional rewarded offer.
  platform_fit_penalizes:
    - IAP-dependent monetization — none is documented.
    - Designs that need a loading or game-ready signal from the portal.
