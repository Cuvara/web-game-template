<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Tower Merge Rush</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #0b1026;
        color: #eef1ff;
        font:
          16px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #ui .hud {
        position: absolute;
        top: max(8px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        display: flex;
        gap: 12px;
        align-items: center;
        font-weight: 700;
        text-shadow: 0 1px 2px #000;
      }
      #ui .hud .spacer {
        flex: 1;
      }
      #ui .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        background: rgba(8, 11, 30, 0.72);
        pointer-events: auto;
      }
      #ui [hidden] {
        display: none !important;
      }
      #ui h1 {
        margin: 0;
        font-size: clamp(28px, 7vmin, 56px);
        color: #ffd66b;
      }
      #ui p {
        margin: 0;
        max-width: 34em;
      }
      #ui button {
        pointer-events: auto;
        min-width: 44px;
        min-height: 44px;
        padding: 10px 22px;
        border: 0;
        border-radius: 10px;
        font: inherit;
        font-weight: 700;
        color: #0b1026;
        background: #ffd66b;
        cursor: pointer;
      }
      #ui button.secondary {
        background: #3a4478;
        color: #eef1ff;
      }
      #ui button.ad::before {
        content: "▶ ";
      }
      #ui .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      #ui .note {
        min-height: 1.4em;
        color: #ffb3b3;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="boot" data-state="loading">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
