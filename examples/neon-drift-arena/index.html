<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Neon Drift Arena</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #05060f;
        color: #eaf6ff;
        font:
          16px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #hud {
        position: absolute;
        top: max(10px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right));
        display: flex;
        gap: 16px;
        font-weight: 700;
        text-shadow: 0 0 8px #0af, 0 1px 2px #000;
      }
      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        background: rgba(5, 6, 15, 0.72);
        pointer-events: auto;
      }
      [hidden] {
        display: none !important;
      }
      h1 {
        margin: 0;
        font-size: clamp(30px, 8vmin, 60px);
        color: #33ffd6;
        text-shadow: 0 0 18px #0fffce;
      }
      p {
        margin: 0;
        max-width: 34em;
        color: #b7c7e0;
      }
      button {
        pointer-events: auto;
        min-width: 44px;
        min-height: 44px;
        padding: 12px 26px;
        border: 0;
        border-radius: 12px;
        font: inherit;
        font-weight: 800;
        color: #05060f;
        background: #33ffd6;
        cursor: pointer;
      }
      button.secondary {
        background: #ff5cf0;
        color: #05060f;
      }
      .note {
        min-height: 1.4em;
        color: #ffb3b3;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui">
      <div id="hud" hidden>
        <span>Score <b id="score">0</b></span>
        <span>Best <b id="best">0</b></span>
      </div>
      <div id="menu" class="screen">
        <h1>Neon Drift Arena</h1>
        <p>Steer with the arrow keys, A/D, or by moving the pointer. Dodge the neon walls.</p>
        <button id="play">Drive</button>
      </div>
      <div id="over" class="screen" hidden>
        <h1>Crashed</h1>
        <p>Score <b id="over-score">0</b></p>
        <div class="note" id="note"></div>
        <button id="revive" class="secondary" hidden>Watch ad to revive</button>
        <button id="restart">Race again</button>
      </div>
    </div>
    <div id="boot" data-state="loading">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
